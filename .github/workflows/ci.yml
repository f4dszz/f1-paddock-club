# Continuous integration for the F1 Paddock Club project.
#
# Intent:
#   Every push and pull request must prove that the backend compiles,
#   lints, type-checks, passes tests with a coverage floor, that DB
#   migrations apply+roll back cleanly, and that the frontend builds,
#   lints, and passes its unit + E2E tests. This is the gate before
#   merging anything.
#
# Design choices (so future maintainers don't wonder):
#   - Separate jobs per toolchain (Python vs Node) so they run in
#     parallel for faster feedback and surface as individual PR checks.
#   - A dedicated `migrations` job runs `alembic upgrade head` then
#     `alembic downgrade base` against a real Postgres service so a
#     broken or drifting migration is caught BEFORE a live deploy
#     (railway.json is the only other place migrations run, at deploy
#     time). `alembic check` guards against model/migration drift.
#   - Caching is on from day one because pip/npm installs dominate
#     wall time for anything nontrivial.
#   - Job names are human-readable on purpose — they appear in the
#     GitHub checks UI for every PR.
#   - Python is pinned to 3.12 everywhere here and in backend/.python-version
#     so CI, local, and prod agree.
#
# The bundled-check-local job proves scripts/check-local.sh (the script
# contributors are told to trust) stays equivalent to these fine-grained
# checks. Keep both in sync.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # One run per branch at a time — cancel superseded runs to save minutes.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-docs:
    name: Agent docs — sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: AGENTS.md and CLAUDE.md stay identical
        run: scripts/check-agent-doc-sync.sh

  gitleaks:
    name: Secret scan — gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # GITLEAKS_LICENSE only required for org-private repos in the future.

  backend:
    name: Backend — lint, type-check, tests + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies (runtime + dev tooling)
        # coverage is pinned inline here rather than in requirements-dev.txt
        # because requirements files are owned by the dependencies batch; if it
        # gets added there later, this `coverage==7.6.10` becomes a harmless
        # redundant pin. Keep the version in sync if so.
        run: pip install -r requirements.txt -r requirements-dev.txt coverage==7.6.10

      - name: Byte-compile all modules
        run: python -m compileall -q .

      - name: Ruff lint
        # Config lives in repo-root pyproject.toml; run from there so paths resolve.
        working-directory: ${{ github.workspace }}
        run: ruff check backend

      - name: Mypy type-check
        working-directory: ${{ github.workspace }}
        run: mypy backend

      - name: Backend unit tests with coverage floor
        # coverage replaces the bare `unittest discover`; --fail-under enforces
        # a floor so coverage cannot silently rot. Raise the number as the suite
        # grows; do not lower it.
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report --fail-under=55

      - name: URL normalizer skill tests
        run: python ../skills/url-normalizer/scripts/test_normalize.py

  migrations:
    name: DB migrations — alembic up/down + drift check (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: f1
          POSTGRES_PASSWORD: f1
          POSTGRES_DB: f1_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U f1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # db.py rewrites a bare postgresql:// URL to postgresql+psycopg:// for psycopg3.
      DATABASE_URL: postgresql://f1:f1@localhost:5432/f1_ci
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply all migrations (upgrade head)
        run: python -m alembic upgrade head

      - name: Detect model/migration drift (alembic check)
        # Fails if the ORM models have diverged from the migration history
        # (i.e. someone changed models.py without adding a migration).
        run: python -m alembic check

      - name: Roll all migrations back (downgrade base)
        # Proves downgrades are reversible end-to-end — the rollback path the
        # runbook depends on (alembic downgrade) actually works.
        run: python -m alembic downgrade base

  frontend:
    name: Frontend — lint, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Use npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=moderate

  e2e:
    name: Browser E2E — smoke + refine + quote_incomplete + explain + saved_trips
    runs-on: ubuntu-latest
    needs: [backend, frontend, agent-docs]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Use npm 11
        run: npm install -g npm@11

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run full deterministic E2E lane (smoke + refine + quote_incomplete + explain + saved_trips)
        # E2E_INCLUDE_SAVED=1 gates the saved_trips save/load round-trip (the
        # flagship enterprise feature) against the SQLite local fallback — no
        # Postgres service needed because db.py falls back to a SQLite file.
        run: E2E_INCLUDE_REFINE=1 E2E_INCLUDE_SAVED=1 LLM_STUB_MODE=1 PYTHON_BIN=python ./scripts/e2e-local.sh

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  bundled-check-local:
    name: Bundled local check — scripts/check-local.sh contract
    runs-on: ubuntu-latest
    # Independent of the fine-grained jobs above on purpose: those split
    # checks for clear PR UX, this proves the bundled script contributors
    # are told to trust still works end-to-end. Keep both.
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies (runtime + dev tooling)
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt coverage==7.6.10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Use npm 11
        run: npm install -g npm@11

      - name: Run scripts/check-local.sh
        run: PYTHON_BIN=python ./scripts/check-local.sh
